# NLO — CI (GitHub Actions)
#
# Stages (all must pass before a commit is eligible for deploy on s52):
#   quality : lint → format:check → typecheck → test → build
#   docker  : image build (no push; images are not part of the deploy path yet)
#
# Live verification (apps/server/scripts/verify-live.ts, e2e-live.ts) is
# intentionally NOT here: it hits real Google accounts through real VLESS
# egress and costs money. It is a manual gate, see docs/testing/README.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (lint / format / typecheck / test / build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test (unit + feature + e2e-mock, all workspaces)
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: docker image build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: nlo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke — container health endpoint
        run: |
          docker build -q -t nlo:ci . > /dev/null
          docker run -d --name nlo-smoke -p 127.0.0.1:4870:4870 nlo:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4870/api/health; then
              echo "health OK"
              exit 0
            fi
            sleep 2
          done
          docker logs nlo-smoke
          exit 1
