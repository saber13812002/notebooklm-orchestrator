# ============================================================================
# R1-B DRAFT — radio.ai.ismc.ir vhost for 172.30.0.133 (BT-Panel nginx 1.31.4)
# ---------------------------------------------------------------------------
# STATUS: DRAFT ONLY — NOT installed on any server during R1-A.
# Based on server52and53/edge_vhost_radio.ai.ismc.ir.conf with R1-A fixes:
#   FIX-1: ACME webroot /var/www/letsencrypt does NOT exist on 133 today
#          (verified 2026-11-10). Go-live step 2 of R1-B creates it:
#            mkdir -p /var/www/letsencrypt && chown -R www:www /var/www/letsencrypt
#   FIX-2: The BT-Panel vhost include path must be CONFIRMED first with
#            sudo nginx -T | grep -E 'include.*vhost'
#          (expected: /www/server/panel/vhost/nginx/*.conf). Do not assume.
#   FIX-3: Upstream port = 8044 (radio_frontend) — VERIFIED in R1-A:
#            8044 serves the SPA and proxies /api/ -> radio_api:8003 (8043).
#          8044 is the single correct edge upstream.
# Independent server block keyed on server_name radio.ai.ismc.ir.
# Does NOT touch rag.ai.ismc.ir, admin.ai.ismc.ir, git.ai.ismc.ir, or NLO.
# ============================================================================

# --- HTTP: ACME challenge + force HTTPS -------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name radio.ai.ismc.ir;

    # Let's Encrypt HTTP-01 validation (webroot must exist — see FIX-1)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: reverse proxy to 53:8044 (radio frontend + API via /api/) -------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name radio.ai.ismc.ir;

    # Let's Encrypt (populated by certbot during R1-B step 7)
    ssl_certificate     /etc/letsencrypt/live/radio.ai.ismc.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radio.ai.ismc.ir/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/radio.ai.ismc.ir.access.log;
    error_log  /var/log/nginx/radio.ai.ismc.ir.error.log;

    client_max_body_size 20m;

    # Static assets — proxy through frontend (it owns the files)
    location ~* \.(css|js|svg|png|jpg|jpeg|woff2?)$ {
        proxy_pass http://172.20.1.53:8044;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=3600";
    }

    # Everything else (SPA + /api/ with SSE/streaming) -> radio frontend
    # The radio frontend nginx on 53:8044 proxies /api/ to radio_api:8003.
    # SSE/streaming: buffering OFF, long read timeout.
    location / {
        proxy_pass http://172.20.1.53:8044;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
        proxy_set_header Connection "";
        proxy_set_header X-Accel-Buffering no;
    }
}
